name: Deploy Admin to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ==================== DEPLOY WITH DOCKER ====================
      # Note: Both .env files are created manually on EC2 (one-time setup):
      #   - server/.env (backend runtime vars)
      #   - .env (frontend build args)

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Go to project directory
            cd ~/smart-restaurant/smart-restaurant-admin

            # Pull latest code
            git pull origin production

            # Reset to HEAD (in case of merge conflicts)
            git reset --hard origin/production

            # Stop and remove old containers
            docker-compose down

            # Rebuild and start containers (uses .env for build args)
            docker-compose up -d --build

            # Clean up dangling images
            docker image prune -f

      - name: Deployment complete
        run: echo "✅ Deployment completed successfully!"
