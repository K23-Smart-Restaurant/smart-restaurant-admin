name: Deploy Admin to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  EC2_PATH: ~/smart-restaurant/smart-restaurant-admin

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ==================== DEPLOY WITH DOCKER ====================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ${{ env.EC2_PATH }}

            # Export environment variables from .env file (React build args)
            export $(grep -v '^#' client/.env | xargs)

            # Pull latest code
            git pull origin production

            # Reset to production branch
            git reset --hard origin/production

            # Stop and remove old containers
            docker-compose down

            # Rebuild and start containers (uses .env for build args)
            docker-compose up -d --build

            # Clean up dangling images
            docker image prune -f

      - name: Deployment complete
        run: echo "✅ Deployment completed successfully!"
