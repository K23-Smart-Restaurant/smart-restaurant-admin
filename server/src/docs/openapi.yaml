          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Order rejected

  /api/waiter/orders/{id}/served:
    post:
      tags:
        - Waiter
      summary: Mark order as served
