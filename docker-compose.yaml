services:
  # Client
  client:
    build: ./client
    container_name: client
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    networks:
      - smart-restaurant-network
    restart: unless-stopped

  # Server
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    networks:
      - smart-restaurant-network
    restart: unless-stopped

networks:
  smart-restaurant-network:
    driver: bridge

