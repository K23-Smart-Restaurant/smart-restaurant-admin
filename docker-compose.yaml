services:
  # Backend API
  backend:
    build: ./server
    container_name: smart-restaurant-admin-backend
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    networks:
      - smart-restaurant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Nginx) - .env file copied during build
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-restaurant-admin-frontend
    ports:
      - "5173:80"
    networks:
      - smart-restaurant-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  smart-restaurant-network:
    driver: bridge
